services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - accrevia_mongo:/data/db

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - accrevia_qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - accrevia_redis:/data

volumes:
  accrevia_mongo:
  accrevia_qdrant:
  accrevia_redis: